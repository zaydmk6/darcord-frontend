<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Darcord</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div class="layout">

  <!-- Servers -->
  <div class="servers">
    <div class="server active">D</div>
    <div class="server">+</div>
  </div>

  <!-- Channels -->
  <div class="channels">
    <h3>Darcord</h3>
    <div class="channel active"># general</div>
    <div class="channel voice-channel">🎤 Voice Room</div>
  </div>

  <!-- Chat -->
  <div class="chat">
    <div class="chat-header">
      <span># general</span>
      <button onclick="toggleTheme()">🌙</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="chat-input">
      <input id="message" placeholder="Message #general">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Members -->
  <div class="members">
    <h4>ONLINE</h4>
    <div id="membersList"></div>
  </div>

</div>

<!-- Voice Overlay -->
<div id="voiceOverlay" class="voice-overlay hidden">
  <div class="voice-box">
    <h2>🎤 Voice Channel</h2>
    <p id="voiceStatus">Connecting...</p>
    <button onclick="leaveVoice()">Leave</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
