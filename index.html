<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Darcord</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="dark">

<div class="layout">

  <!-- SERVERS -->
  <div class="servers">
    <div class="server active">D</div>
    <div class="server add-server" onclick="createServer()">+</div>
  </div>

  <!-- CHANNELS -->
  <div class="channels">
    <div class="server-header">
      <h3>Darcord</h3>
      <span class="online-count" id="onlineCount">0 Online</span>
    </div>

    <div class="channel active" onclick="switchChannel(1)">
      <span>#</span> general
    </div>

    <div class="channel voice-channel" onclick="openVoiceOverlay(1)">
      🎤 Voice Room
      <span class="voice-count" id="voiceCount">0</span>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat">

    <div class="chat-header">
      <div class="channel-info">
        <span id="channelName"># general</span>
      </div>

      <div class="chat-actions">
        <button onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="chat-input">
      <input id="message" placeholder="Message #general" autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <!-- MEMBERS -->
  <div class="members">
    <h4>ONLINE</h4>
    <div id="membersList"></div>
  </div>

</div>

<!-- VOICE OVERLAY -->
<div id="voiceOverlay" class="voice-overlay hidden">

  <div class="voice-box">

    <div class="voice-header">
      <h2>🎤 Voice Channel</h2>
      <span id="voiceUsersCount">0 Connected</span>
    </div>

    <div class="voice-users" id="voiceUsers">
      <!-- dynamically filled -->
    </div>

    <div class="voice-controls">
      <button onclick="toggleMute()" id="muteBtn">🔊 Mute</button>
      <button onclick="leaveVoice()" class="leave-btn">Leave</button>
    </div>

    <p id="voiceStatus">Connecting...</p>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
